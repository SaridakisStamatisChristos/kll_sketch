name: Release Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - "kll_sketch/**"
      - "pyproject.toml"
      - "README.md"
      - "CITATION.cff"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/release-artifacts.yml"
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "kll_sketch/**"
      - "pyproject.toml"
      - "README.md"
      - "CITATION.cff"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/release-artifacts.yml"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release version and tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          from kll_sketch import __version__
          ref = os.environ.get("GITHUB_REF_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          print("version", __version__, "ref", ref, "ref_type", ref_type, "event", event)
          if event == "push" and ref_type == "tag" and ref != f"v{__version__}":
              raise SystemExit(f"tag {ref!r} does not match package version v{__version__}")
          PY
      - name: Run release test suite
        run: |
          python -m pip install -r kll_sketch/requirements-test.txt
          KLL_SKETCH_DISABLE_NATIVE=1 python -m pytest -q kll_sketch/tests
          python -m kll_sketch._native_build
          python -m pytest -q kll_sketch/tests
      - name: Build pure wheel and source distribution
        run: |
          rm -rf dist
          mkdir dist
          python - <<'PY'
          from kll_sketch._build_backend import build_sdist, build_wheel
          print(build_wheel("dist"))
          print(build_sdist("dist"))
          PY
      - name: Verify artifact metadata and contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import tarfile
          from zipfile import ZipFile

          dist = Path("dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          assert wheel.name.endswith("-py3-none-any.whl")
          with ZipFile(wheel) as zf:
              names = zf.namelist()
              dist_info = "kll_sketch-3.2.2.dist-info"
              metadata = zf.read(f"{dist_info}/METADATA").decode()
              license_path = f"{dist_info}/licenses/LICENSE"
              record = zf.read(f"{dist_info}/RECORD").decode().splitlines()
              assert "Version: 3.2.2" in metadata
              assert "Requires-Python: >=3.10" in metadata
              assert "License-Expression: Apache-2.0" in metadata
              assert "License-File: LICENSE" in metadata
              assert license_path in names
              assert f"{dist_info}/LICENSE" not in names
              assert zf.read(license_path) == Path("LICENSE").read_bytes()
              assert any(line.startswith(f"{license_path},sha256=") for line in record)
              assert not any("/tests/" in n for n in names)
              assert not any(n.endswith((".cpp", ".inc", ".so", ".pyd")) for n in names)
          with tarfile.open(sdist, "r:gz") as tf:
              names = tf.getnames()
              for required in (
                  "README.md", "LICENSE", "pyproject.toml", "CITATION.cff",
                  "CONTRIBUTING.md", "SECURITY.md", "PKG-INFO",
                  "kll_sketch/_native.cpp",
              ):
                  assert any(n.endswith("/" + required) for n in names), required
              pkg_info_name = next(n for n in names if n.endswith("/PKG-INFO"))
              pkg_info_file = tf.extractfile(pkg_info_name)
              assert pkg_info_file is not None
              pkg_info = pkg_info_file.read().decode()
              assert "Metadata-Version: 2.4" in pkg_info
              assert "Version: 3.2.2" in pkg_info
          with (dist / "SHA256SUMS").open("w", encoding="utf-8") as out:
              for artifact in sorted(p for p in dist.iterdir() if p.is_file() and p.name != "SHA256SUMS"):
                  out.write(f"{hashlib.sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}\n")
          PY
      - name: Install release wheel outside checkout
        run: |
          python -m venv /tmp/kll-release-wheel
          /tmp/kll-release-wheel/bin/pip install --no-index dist/*.whl
          cd /tmp
          /tmp/kll-release-wheel/bin/python - <<'PY'
          from kll_sketch import KLL, __version__, native_available
          assert __version__ == "3.2.2"
          assert not native_available()
          sk = KLL(200, 7331)
          sk.extend(range(100000))
          sk.validate()
          assert KLL.from_bytes(sk.to_bytes()).to_bytes() == sk.to_bytes()
          print("release wheel smoke passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kll-sketch-v3.2.2-release-artifacts
          path: dist/
