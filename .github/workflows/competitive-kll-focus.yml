name: Focused Apache KLL Gate

on:
  push:
    branches:
      - competitive-benchmark-2026-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install direct competitor
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.2 datasketches==5.2.0
      - name: Build native backend
        run: |
          python -m kll_sketch._native_build
          python -c "from kll_sketch import native_backend_info; i=native_backend_info(); print(i); assert i['available'] and i['enabled']"
      - name: Benchmark public KLL APIs
        run: |
          python benchmarks/competitive_kll_focus.py --N 250000 --k 200 --seed 7331 --trials 5 --query-loops 2000 --shards 8 --out competitive_focus.json
      - name: Print headline
        run: |
          python - <<'PY'
          import json
          x=json.load(open('competitive_focus.json'))
          print('ours', x['ours'])
          print('apache', x['apache'])
          print('ratios_ours_over_apache', x['ratios_ours_over_apache'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: focused-apache-kll-results
          path: competitive_focus.json
