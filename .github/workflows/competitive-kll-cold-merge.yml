name: Cold Apache KLL Merge Gate

on:
  push:
    branches: ["competitive-benchmark-2026-09"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install direct competitor
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.2 datasketches==5.2.0
      - name: Build native backend
        run: |
          python -m kll_sketch._native_build
          python -c "from kll_sketch import native_backend_info; i=native_backend_info(); print(i); assert i['available'] and i['enabled'] and i['persistent_state']"
      - name: Benchmark fresh-destination merge
        run: >-
          python benchmarks/competitive_kll_cold_merge.py
          --N 250000
          --k 200
          --seed 7331
          --shards 8
          --trials 31
          --loops 128
          --out competitive_cold_merge.json
      - name: Print headline
        run: |
          python - <<'PY'
          import json
          x = json.load(open('competitive_cold_merge.json'))
          print('ours', x['ours'])
          print('apache', x['apache'])
          print('paired', x['paired'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cold-apache-kll-merge-results
          path: competitive_cold_merge.json
