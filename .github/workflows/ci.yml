name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kll_sketch/requirements-test.txt
      - name: Compile runtime
        run: python -m compileall -q kll_sketch
      - name: Run tests with coverage
        env:
          KLL_SKETCH_DISABLE_NATIVE: "1"
        run: >-
          python -m pytest -q kll_sketch/tests
          --cov=kll_sketch
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  native-test:
    name: native-${{ matrix.os }}-py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kll_sketch/requirements-test.txt
      - name: Build native extension in place
        run: python -m kll_sketch._native_build
      - name: Native diagnostics
        run: |
          python -c "from kll_sketch import native_backend_info; info=native_backend_info(); print(info); assert info['available'] and info['enabled']"
      - name: Run full suite with native dispatch
        run: python -m pytest -q kll_sketch/tests

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build pure wheel and sdist with in-tree backend
        run: |
          mkdir -p dist
          python - <<'PY'
          from kll_sketch._build_backend import build_sdist, build_wheel
          print(build_wheel("dist"))
          print(build_sdist("dist"))
          PY
      - name: Inspect pure wheel contents and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          assert wheel.name.endswith("-py3-none-any.whl")
          with ZipFile(wheel) as zf:
              names = zf.namelist()
              assert "kll_sketch/kll_sketch.py" in names
              assert "kll_sketch/__init__.py" in names
              assert "kll_sketch/_native_runtime.py" in names
              assert not any("/tests/" in name for name in names)
              assert "kll_sketch/_build_backend.py" not in names
              assert "kll_sketch/_native_build.py" not in names
              assert not any(
                  name.startswith("kll_sketch/_native") and name.endswith((".cpp", ".inc"))
                  for name in names
              )
              assert not any(name.endswith((".so", ".pyd")) for name in names)
              metadata = zf.read(next(n for n in names if n.endswith("/METADATA"))).decode()
              wheel_meta = zf.read(next(n for n in names if n.endswith("/WHEEL"))).decode()
              assert "Metadata-Version: 2.4" in metadata
              assert "License-Expression: Apache-2.0" in metadata
              assert "Root-Is-Purelib: true" in wheel_meta
              assert "Tag: py3-none-any" in wheel_meta
          print(wheel)
          PY
      - name: Install built pure wheel and smoke test outside source tree
        run: |
          python -m venv /tmp/kll-wheel-test
          /tmp/kll-wheel-test/bin/pip install --no-index dist/*.whl
          cd /tmp
          /tmp/kll-wheel-test/bin/python - <<'PY'
          from kll_sketch import KLL, KLLSketch, __version__, native_available
          assert KLLSketch is KLL
          assert not native_available()
          sk = KLL(200, 7331)
          sk.extend(range(100000))
          sk.validate()
          restored = KLL.from_bytes(sk.to_bytes())
          restored.validate()
          assert restored.to_bytes() == sk.to_bytes()
          print(__version__, sk.num_retained)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-pure
          path: dist/

  native-package:
    runs-on: ubuntu-latest
    needs: native-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build native wheel
        run: |
          mkdir -p dist-native
          python - <<'PY'
          from kll_sketch._build_backend import build_wheel
          print(build_wheel("dist-native", {"native": "true"}))
          PY
      - name: Inspect native wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist-native").glob("*.whl"))
          assert "-cp313-cp313-" in wheel.name
          with ZipFile(wheel) as zf:
              names = zf.namelist()
              assert any(name.startswith("kll_sketch/_native") and name.endswith(".so") for name in names)
              assert "kll_sketch/_native_build.py" not in names
              assert not any(
                  name.startswith("kll_sketch/_native") and name.endswith((".cpp", ".inc"))
                  for name in names
              )
              wheel_meta = zf.read(next(n for n in names if n.endswith("/WHEEL"))).decode()
              assert "Root-Is-Purelib: false" in wheel_meta
          print(wheel)
          PY
      - name: Install native wheel and verify backend
        run: |
          python -m venv /tmp/kll-native-wheel-test
          /tmp/kll-native-wheel-test/bin/pip install --no-index dist-native/*.whl
          cd /tmp
          /tmp/kll-native-wheel-test/bin/python - <<'PY'
          from array import array
          from kll_sketch import KLL, native_backend_info
          info = native_backend_info()
          assert info["available"] and info["enabled"]
          sk = KLL(200, 7331)
          sk.extend(array("d", (float(i) for i in range(100000))))
          sk.validate()
          assert sk.min_value == 0.0 and sk.max_value == 99999.0
          print(info, sk.num_retained)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-native-linux-cp313
          path: dist-native/

  offline-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Source install without package index
        run: |
          python -m venv .venv-offline
          PIP_NO_INDEX=1 .venv-offline/bin/pip install --no-index .
      - name: Offline smoke test
        run: |
          cd /tmp
          $GITHUB_WORKSPACE/.venv-offline/bin/python - <<'PY'
          from kll_sketch import KLL, native_available
          assert not native_available()
          sketch = KLL(128, 42)
          sketch.extend(range(10000))
          sketch.validate()
          assert sketch.min_value == 0.0
          assert sketch.max_value == 9999.0
          print("offline pure source install passed")
          PY

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rank-space characterization smoke
        env:
          KLL_SKETCH_DISABLE_NATIVE: "1"
        run: |
          python benchmarks/bench_kll.py \
            --outdir bench_out \
            --Ns 1e5 \
            --capacities 100 200 \
            --distributions normal duplicates \
            --qs .01 .1 .5 .9 .99 \
            --trials 2 \
            --shards 4
          python benchmarks/validate_benchmarks.py bench_out
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-pure
          path: bench_out/

  native-benchmark:
    runs-on: ubuntu-latest
    needs: native-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build native extension
        run: python -m kll_sketch._native_build
      - name: Differential speed gate
        run: python benchmarks/bench_native.py --N 300000 --k 200 --min-speedup 1.25
